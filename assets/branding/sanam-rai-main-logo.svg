<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="682" viewBox="0 0 2048 682" role="img" aria-labelledby="title desc">
<title id="title">Sanam Rai — Backend · Systems · AI</title>
<desc id="desc">Official Sanam Rai brand lockup with interlocked SR monogram, Backend Systems AI positioning, and Build Learn Improve signature.</desc>

<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".24" stop-color="#f9fbfd"/>
    <stop offset=".52" stop-color="#dceaf3"/>
    <stop offset=".78" stop-color="#f8fbfd"/>
    <stop offset="1" stop-color="#b7cbd9"/>
  </linearGradient>

  <linearGradient id="iceBlue" x1=".2" y1=".05" x2=".8" y2=".95">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".35" stop-color="#e9f9ff"/>
    <stop offset=".63" stop-color="#57c7f1"/>
    <stop offset=".82" stop-color="#108ee0"/>
    <stop offset="1" stop-color="#075bd4"/>
  </linearGradient>

  <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".48" stop-color="#e9f1f7"/>
    <stop offset=".69" stop-color="#7fdcff"/>
    <stop offset=".84" stop-color="#22bdf2"/>
    <stop offset="1" stop-color="#096bdc"/>
  </linearGradient>

  <linearGradient id="sub" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".55" stop-color="#d9e4ed"/>
    <stop offset="1" stop-color="#9eafbd"/>
  </linearGradient>

  <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feFlood flood-color="#00c8ff" flood-opacity=".52"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00182c" flood-opacity=".55"/>
  </filter>
</defs>

<!-- SR monogram -->
<g transform="translate(18 80) scale(1.22)" filter="url(#softShadow)">
  <path d="M140 118
           C140 84 172 58 215 58
           H322
           L286 96
           H216
           C195 96 180 107 180 124
           C180 139 189 150 204 164
           L272 230
           C292 249 300 268 300 289
           C300 324 271 351 229 351
           H118
           L156 312
           H226
           C246 312 259 302 259 287
           C259 276 252 266 239 254
           L174 190
           C151 168 140 144 140 118 Z"
        fill="url(#iceBlue)"
        stroke="#dff6ff"
        stroke-width="2.2"/>

  <path d="M234 145
           H326
           C374 145 405 174 405 214
           C405 249 382 274 349 282
           L408 354
           H355
           L300 287
           H272
           V354
           H230
           V247
           H326
           C347 247 362 234 362 215
           C362 196 347 183 326 183
           H270
           Z"
        fill="url(#silver)"
        stroke="#eef8ff"
        stroke-width="2.2"/>

  <path d="M232 145H270L309 183H270Z" fill="#dff6ff"/>
</g>

<!-- Wordmark -->
<g transform="skewX(-5)">
  <text x="615" y="375"
        font-family="Arial Black, Segoe UI Black, Segoe UI, Arial, sans-serif"
        font-size="190"
        font-weight="900"
        letter-spacing="4"
        fill="url(#wordmark)"
        stroke="#d9efff"
        stroke-width="3"
        paint-order="stroke fill"
        filter="url(#blueGlow)">SANAM RAI</text>
</g>

<!-- Positioning -->
<g font-family="Arial, Segoe UI, sans-serif" text-anchor="middle">
  <line x1="575" y1="478" x2="732" y2="478" stroke="#40ccff" stroke-width="8" stroke-linecap="round"/>
  <line x1="1805" y1="478" x2="1962" y2="478" stroke="#40ccff" stroke-width="8" stroke-linecap="round"/>

  <text x="1268" y="501"
        font-size="72"
        font-weight="800"
        letter-spacing="8"
        fill="url(#sub)"
        stroke="#9cb3c5"
        stroke-width="1.8"
        paint-order="stroke fill">
    BACKEND <tspan fill="#20c9f3">•</tspan> SYSTEMS <tspan fill="#20c9f3">•</tspan> AI
  </text>

  <text x="1268" y="591"
        font-size="49"
        font-weight="600"
        letter-spacing="9"
        fill="#b8c4ce">
    Build <tspan fill="#20c9f3">•</tspan> Learn <tspan fill="#20c9f3">•</tspan> Improve
  </text>
</g>
</svg>