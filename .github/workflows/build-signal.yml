name: Update build signal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches:
      - master
    paths:
      - 'scripts/generate-contributions.mjs'
      - '.github/workflows/build-signal.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate contribution data art
        run: node scripts/generate-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: SanamRai001

      - name: Commit refreshed signal
        run: |
          if git diff --quiet; then
            echo "Build signal is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/build-signal.svg
          git commit -m "chore: refresh build signal"
          git push